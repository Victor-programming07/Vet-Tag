<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Credenciales - Vet-Tag</title>
    <link href="https://cdn.jsdelivr.net/style/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-center text-primary mb-3">Vet-Tag</h3>
            <h6 class="card-subtitle mb-4 text-muted text-center">Configurar / Actualizar Credenciales</h6>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/cambiar_credenciales" method="POST">
                <div class="mb-3">
                    <label for="nuevo_usuario" class="form-label">Nuevo Usuario</label>
                    <input type="text" class="form-control" id="nuevo_usuario" name="nuevo_usuario" required placeholder="Ingrese su usuario">
                </div>
                <div class="mb-3">
                    <label for="nueva_clave" class="form-label">Nueva Contraseña</label>
                    <input type="password" class="form-control" id="nueva_clave" name="nueva_clave" required placeholder="Ingrese su contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar Credenciales</button>
            </form>
        </div>
    </div>

</body>
</html>
